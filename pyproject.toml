[project]
name = "credit-card-portfolio-risk-monitor"
version = "1.0.0"
description = "Delinquency migration, cure and charge-off timing on a public card-status panel (DuckDB SQL, Python, Streamlit)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT (code only; see docs/data_licence.md for the dataset)" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806", "N802", "N812", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E402"]
"app/pages/*" = ["E402", "N999"]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
